---
- name: Configure web servers
  hosts: static
  become: true
  roles:
    - role: caddy-ansible
      caddy_systemd_capabilities_enabled: true
      caddy_config: |
        photo.rleo.ovh {
          handle {
            reverse_proxy :8000
          }
        }
        sortir.in {
          handle {
            reverse_proxy :8090
          }
        }
        aronin.app {
          redir https://dental-aronin.webflow.io/
        }
