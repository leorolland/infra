# This is a basic workflow to help you get started with Actions

name: CI

# Controls when the workflow will run
on:
  # Triggers the workflow on push or pull request events but only for the "main" branch
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: run-ansible-lint
        uses: ansible/ansible-lint@v26.8.0

  deploy:
    name: Run playbook
    # Only on main: pushes and manual runs, never PRs
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: lint
    runs-on: ubuntu-latest
    # Prevents overlapping deploys (e.g. apt/dpkg lock conflicts on the target)
    concurrency:
      group: deploy-production
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@v7

      - name: Install Ansible
        run: pipx install ansible

      - name: Install requirements
        run: |
          ansible-galaxy collection install community.general
          ansible-galaxy install -r requirements.yml

      - name: Set up SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Run playbook
        run: ansible-playbook -i inventory.yml site.yml --diff
